[project]
name = "dreaming-osc-relay"
version = "0.1.0"
description = "Standalone OSC relay for the Dreaming installation: observes a dream server's WebSocket feed and re-emits it as OSC/UDP to local gear."
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "python-osc>=1.8",
    # so TLS verification uses the OS trust store (see --system-trust
    # in cli.py): managed Macs carry their proxy root in the Keychain,
    # which the CA *file* Python reads by default never sees
    "truststore>=0.10",
]

[project.scripts]
dreaming-osc-relay = "dreaming_osc_relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreaming_osc_relay"]
